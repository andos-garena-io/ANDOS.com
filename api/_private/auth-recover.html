<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Restoring ANDOS session</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #070b14; }
    body { min-height: 100vh; display: grid; place-items: center; color: #e8edf7; font: 600 14px system-ui, sans-serif; }
    main { display: grid; justify-items: center; gap: 14px; min-height: 100vh; place-content: center; padding: 24px; }
    .spinner { width: 28px; height: 28px; border: 3px solid rgba(232,237,247,.22); border-top-color: #e8edf7; border-radius: 50%; animation: spin .8s linear infinite; }
    p { margin: 0; opacity: .76; letter-spacing: .01em; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 1.6s; } }
  </style>
</head>
<body>
  <main aria-live="polite" aria-label="Restoring your session">
    <div class="spinner" aria-hidden="true"></div>
    <p>Restoring your session…</p>
  </main>
  <script type="module" src="/auth-recover.js"></script>
</body>
</html>
